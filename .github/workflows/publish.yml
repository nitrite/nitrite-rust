name: Publish to crates.io

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish Crates
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # The single source of the publish order. Adding a crate to the workspace
    # means adding it here, and nowhere else.
    env:
      PUBLISH_ORDER: >-
        nitrite_derive
        nitrite
        nitrite_fjall_adapter
        nitrite_spatial
        nitrite_tantivy_fts
        nitrite_vector
        nitrite-bridge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-publish-

      - name: Verify build
        run: cargo build --release --workspace

      # **One ordered list, used by the publish and by the dry run.** There were
      # two, and `nitrite-bridge` reached only one of them — the same way
      # `dbinspect_hive_ce` was left out of dbinspect's release loop and went
      # unpublished without anything failing. Order is dependency order:
      # `nitrite_derive` and `nitrite` first, `nitrite-bridge` last.
      - name: Publish, in dependency order
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in $PUBLISH_ORDER; do
            version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name==$c) | .version')"
            echo "::group::$crate $version"
            if curl -sfo /dev/null -H 'User-Agent: nitrite-release' \
                 "https://crates.io/api/v1/crates/$crate/$version"; then
              # A release that dies half way through has to be resumable: every
              # crate after `nitrite` resolves it from the registry, so the
              # second attempt would otherwise fail on the first six.
              echo "$crate $version is already on crates.io"
            else
              cargo publish -p "$crate"
              # crates.io's index is not immediately consistent, and the next
              # crate in the list resolves this one from it.
              sleep 30
            fi
            echo "::endgroup::"
          done

      - name: Dry run - verify every crate that would be published
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          set -euo pipefail
          for crate in $PUBLISH_ORDER; do
            cargo package -p "$crate" --allow-dirty
          done
          echo "All packages verified successfully!"
